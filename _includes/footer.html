<footer class="site-footer">
  <div class="container-md">
    <div class="row">
      <div class="col-xl-8 offset-xl-2 col-lg-10 offset-lg-1">
        <div class="site-footer-row">
          <span>{% if site.author %}{{ site.author }}, {% endif %}{{ site.time | date: '%Y' }}</span>
          <a href="{{ '/feed.xml' | absolute_url }}">Segui con RSS</a>
        </div>
        {% unless site.remove-ads %}
        <p class="site-footer-credit">
          Realizzato con <a href="https://beautifuljekyll.com">Beautiful Jekyll</a>
        </p>
        {% endunless %}
      </div>
    </div>
  </div>
</footer>
