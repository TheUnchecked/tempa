<nav class="navbar navbar-light navbar-custom">

  <div class="navbar-collapse" id="main-navbar">
    <ul class="navbar-nav mr-auto">
      {%- for link in site.navbar-links -%}
        {%- if link[1].first %}
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">{{ link[0] }}</a>
            <div class="dropdown-menu dropdown-menu-right" aria-labelledby="navbarDropdown">
              {%- for childlink in link[1] -%}
                {%- for linkparts in childlink %}
                  <a class="dropdown-item" href="{{ linkparts[1] | relative_url }}">{{ linkparts[0] }}</a>
                {%- endfor -%}
              {%- endfor %}
            </div>
          </li>
        {% else %}
          <li class="nav-item{% if page.url contains link[1] %} active{% endif %}">
            <a class="nav-link" href="{{ link[1] | relative_url }}">{{ link[0] }}</a>
          </li>
        {%- endif -%}
      {%- endfor -%}
    </ul>

    <button id="theme-toggle" class="theme-toggle" aria-label="Cambia tema">
      <span class="icon-moon">&#9789;</span>
      <span class="icon-sun">&#9788;</span>
    </button>
  </div>

</nav>
