---
layout: page
title: Grafo
subtitle: "Le connessioni tra gli articoli"
---

<style>
  #graph-container {
    width: 100%;
    height: 600px;
    border: 1px solid var(--tempa-border);
    border-radius: var(--tempa-radius);
    background: var(--superficie);
    overflow: hidden;
    position: relative;
  }

  #graph-container svg {
    width: 100%;
    height: 100%;
  }

  .node circle {
    stroke-width: 2px;
    cursor: pointer;
    transition: r 0.2s;
  }

  .node text {
    font-family: var(--header-font);
    font-stretch: 78%;
    font-size: 12px;
    pointer-events: none;
    fill: var(--tempa-text);
  }

  .link {
    stroke: var(--tempa-border);
    stroke-opacity: 0.7;
    stroke-width: 1.5px;
  }

  .node circle:hover {
    stroke-width: 3px;
  }

  #graph-legend {
    margin-top: 1rem;
    font-size: 0.85rem;
    color: var(--tempa-muted);
  }

  #tooltip {
    position: absolute;
    background: var(--tempa-bg);
    border: 1px solid var(--tempa-border);
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 13px;
    color: var(--tempa-text);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    max-width: 200px;
    z-index: 10;
  }
</style>

<div id="graph-container">
  <div id="tooltip"></div>
  <svg id="graph-svg"></svg>
</div>

<div id="graph-legend">
  Clicca su un nodo per aprire l'articolo &nbsp;·&nbsp; Trascina per esplorare
</div>

<script src="{{ '/assets/vendor/d3/d3.min.js' | relative_url }}"></script>

<script>
  // ── Dati del grafo, generati da site.posts ─────────────────────────────────
  {% assign posts = site.posts %}
  const graphData = {
    nodes: [
      {% for post in posts %}
      {
        id: "post-{{ forloop.index0 }}",
        label: {{ post.title | strip_html | jsonify }},
        url: "{{ post.url | relative_url }}",
        tags: {{ post.tags | jsonify }},
        size: 18
      }{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ],
    links: [
      {% capture links_raw %}
      {% for post in posts %}
        {% assign i = forloop.index0 %}
        {% for other in posts %}
          {% assign j = forloop.index0 %}
          {% if j > i %}
            {% assign shared = false %}
            {% for tag in post.tags %}
              {% if other.tags contains tag %}{% assign shared = true %}{% endif %}
            {% endfor %}
            {% if shared %}{ source: "post-{{ i }}", target: "post-{{ j }}" }|||{% endif %}
          {% endif %}
        {% endfor %}
      {% endfor %}
      {% endcapture %}
      {% assign links_array = links_raw | strip | split: "|||" %}
      {% for l in links_array %}{{ l | strip }}{% unless forloop.last %},{% endunless %}
      {% endfor %}
    ]
  };

  // ── Colori per etichetta, assegnati da una tavolozza fissa ──────────────────
  const tavolozza = ["#e07b54", "#5b8dd9", "#4caf7d", "#9c6fde", "#d3a23a", "#4d9aa8"];
  const coloriEtichette = {};
  let indiceColore = 0;
  graphData.nodes.forEach(function (nodo) {
    (nodo.tags || []).forEach(function (tag) {
      if (!(tag in coloriEtichette)) {
        coloriEtichette[tag] = tavolozza[indiceColore % tavolozza.length];
        indiceColore++;
      }
    });
  });

  function coloreNodo(nodo) {
    for (const tag of (nodo.tags || [])) {
      if (coloriEtichette[tag]) return coloriEtichette[tag];
    }
    return "#aaaaaa";
  }

  // ── Setup SVG ───────────────────────────────────────────────────────────────
  const container = document.getElementById("graph-container");
  const svg = d3.select("#graph-svg");
  const tooltip = document.getElementById("tooltip");

  const width  = container.clientWidth;
  const height = container.clientHeight;

  const g = svg.append("g");

  // Zoom & pan
  svg.call(d3.zoom()
    .scaleExtent([0.3, 3])
    .on("zoom", (event) => g.attr("transform", event.transform))
  );

  // ── Simulazione forza ───────────────────────────────────────────────────────
  const simulation = d3.forceSimulation(graphData.nodes)
    .force("link", d3.forceLink(graphData.links)
      .id(d => d.id)
      .distance(160))
    .force("charge", d3.forceManyBody().strength(-300))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collision", d3.forceCollide().radius(d => d.size + 20));

  // ── Link ────────────────────────────────────────────────────────────────────
  const link = g.append("g")
    .selectAll("line")
    .data(graphData.links)
    .join("line")
    .attr("class", "link");

  // ── Nodi ────────────────────────────────────────────────────────────────────
  const node = g.append("g")
    .selectAll("g")
    .data(graphData.nodes)
    .join("g")
    .attr("class", "node")
    .call(d3.drag()
      .on("start", dragStart)
      .on("drag",  dragging)
      .on("end",   dragEnd)
    )
    .on("click", (event, d) => {
      window.location.href = d.url;
    })
    .on("mouseover", (event, d) => {
      tooltip.style.opacity = "1";
      tooltip.innerHTML = `<strong>${d.label}</strong><br><small>${(d.tags || []).join(", ")}</small>`;
    })
    .on("mousemove", (event) => {
      const rect = container.getBoundingClientRect();
      tooltip.style.left = (event.clientX - rect.left + 12) + "px";
      tooltip.style.top  = (event.clientY - rect.top  - 10) + "px";
    })
    .on("mouseout", () => {
      tooltip.style.opacity = "0";
    });

  node.append("circle")
    .attr("r", d => d.size)
    .attr("fill", d => coloreNodo(d))
    .attr("stroke", d => d3.color(coloreNodo(d)).darker(0.5));

  node.append("text")
    .attr("dy", d => d.size + 14)
    .attr("text-anchor", "middle")
    .text(d => d.label.length > 28 ? d.label.slice(0, 26) + "…" : d.label);

  // ── Tick ────────────────────────────────────────────────────────────────────
  simulation.on("tick", () => {
    link
      .attr("x1", d => d.source.x)
      .attr("y1", d => d.source.y)
      .attr("x2", d => d.target.x)
      .attr("y2", d => d.target.y);

    node.attr("transform", d => `translate(${d.x},${d.y})`);
  });

  // ── Drag ────────────────────────────────────────────────────────────────────
  function dragStart(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
  }
  function dragging(event, d) {
    d.fx = event.x; d.fy = event.y;
  }
  function dragEnd(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
  }
</script>
