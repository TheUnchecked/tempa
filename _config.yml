# ============================================
# TEMPA — Pensieri controvento
# _config.yml
# ============================================

# --- URL ---
url: "https://theunchecked.github.io"
baseurl: "/tempa"

favicon: "/favicon.ico"

# --- Informazioni principali ---
title: Tempa
description: "Pensieri controvento"
author: Dino
language: it

# --- Menu ---
navbar-links:
  Articoli: "/"
  Etichette: "tags"
  Grafo: "grafo"
  Chi sono: "aboutme"

# --- CSS e JS ---
site-css:
  - "/assets/vendor/fonts/fonts.css"
  - "/assets/css/custom.css"
  - "/assets/css/tema.css"

site-js:
  - "/assets/js/theme-toggle.js"

defaults:
  # Tempo di lettura attivo per tutti gli articoli
  - scope:
      path: ""
      type: "posts"
    values:
      readtime: true
  # Script nel <head> per il tema (evita il lampo bianco)
  - scope:
      path: ""
    values:
      head-extra:
        - tema-head.html

# --- Social (togli il # per attivare) ---
social-networks:
  # github: TheUnchecked

# --- Colori (tema chiaro; lo scuro è in tema.css) ---
navbar-col: "#fbfbf9"
navbar-text-col: "#1f2326"
navbar-border-col: "#dcdbd5"
footer-col: "#fbfbf9"
footer-text-col: "#5c605f"
footer-link-col: "#a3261b"
footer-hover-col: "#7d1c14"
page-col: "#fbfbf9"
text-col: "#1f2326"
link-col: "#a3261b"
hover-col: "#7d1c14"

# --- Paginazione ---
paginate: 8

# --- Post ---
post_search: false
share-links-active:
  twitter: false
  facebook: false
  linkedin: false

# --- Impostazioni avanzate ---
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
kramdown:
  input: GFM

plugins:
  - jekyll-paginate
  - jekyll-sitemap

exclude:
  - README.md
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - Tools
  - editorial
  - CHANGELOG.md
  - screenshot.png
  - Appraisals
  - beautiful-jekyll-theme.gemspec
  - staticman.yml